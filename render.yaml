services:
  - type: web
    name: tailor-express-booking
    runtime: docker
    plan: starter
    repo: https://github.com/tailorexpresskw/booking
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    disk:
      name: booking-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: UPAYMENTS_API_KEY
        sync: false
      - key: UPAYMENTS_BASE_URL
        value: https://sandboxapi.upayments.com
      - key: PAYMENT_AMOUNT_KWD
        value: 3.500
      - key: APP_BASE_URL
        value: https://tailor-express-booking.onrender.com
