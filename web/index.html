<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tailor Express premium home service booking.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6E1D32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tailor Express">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/tailor-logo-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/tailor-logo-192.png">
  <title>Tailor Express Home Booking</title>
  <style>
    :root {
      --brand-maroon: #6e1d32;
      --brand-cream: #fbf4e8;
      --brand-line: #e8d9c4;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--brand-cream);
    }

    .app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 15%, rgba(110, 29, 50, 0.08), transparent 30%),
        linear-gradient(135deg, #fffaf0 0%, var(--brand-cream) 100%);
      color: var(--brand-maroon);
      font-family: Arial, sans-serif;
      text-align: center;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .app-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(420px, 92vw);
      padding: 34px 24px;
      border: 1px solid var(--brand-line);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 50px rgba(66, 35, 23, 0.12);
    }

    .loader-logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      object-fit: contain;
      animation: loaderPulse 1.4s ease-in-out infinite;
    }

    .loader-title {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .loader-text {
      margin: 0;
      color: #6f5c54;
      font-size: 16px;
      line-height: 1.6;
    }

    .loader-bar {
      position: relative;
      overflow: hidden;
      height: 8px;
      margin: 24px auto 0;
      border-radius: 999px;
      background: #ecdcc7;
    }

    .loader-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 45%;
      border-radius: inherit;
      background: var(--brand-maroon);
      animation: loaderMove 1.1s ease-in-out infinite;
    }

    @keyframes loaderPulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    @keyframes loaderMove {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(230%);
      }
    }
  </style>
</head>
<body>
  <div id="app-loader" class="app-loader" aria-live="polite" aria-label="Loading Tailor Express">
    <div class="loader-card">
      <img class="loader-logo" src="icons/tailor-logo-192.png" alt="Tailor Express">
      <h1 class="loader-title">Tailor Express</h1>
      <p class="loader-text">Loading your booking page...</p>
      <p class="loader-text" dir="rtl">جاري تحميل صفحة الحجز...</p>
      <div class="loader-bar" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loader');
      if (loader) {
        loader.classList.add('is-hidden');
        window.setTimeout(function () {
          loader.remove();
        }, 260);
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
