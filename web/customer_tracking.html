<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6E1D32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tailor Express">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/tailor-logo-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/tailor-logo-192.png">
  <title>Tailor Express Tracking</title>
  <style>
    :root {
      --maroon: #6e1d32;
      --maroon-dark: #3a0d18;
      --sand: #faf5ea;
      --card: #fffdf8;
      --line: #ead8bc;
      --ink: #24191c;
      --muted: #766a67;
      --success: #326b45;
      --warning: #8a5a00;
      --danger: #9b1c38;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, rgba(110, 29, 50, 0.08), transparent 28%),
        linear-gradient(180deg, #fffaf0 0%, var(--sand) 100%);
      color: var(--ink);
      font-family: Arial, "Helvetica Neue", Tahoma, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px clamp(16px, 5vw, 52px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--maroon);
      font-size: clamp(22px, 4vw, 34px);
      direction: ltr;
    }

    .brand img {
      width: 46px;
      height: 46px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    .link-button {
      border: 1.5px solid rgba(110, 29, 50, 0.65);
      border-radius: 999px;
      background: #fffaf2;
      color: var(--maroon);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      min-height: 46px;
      padding: 10px 20px;
      text-decoration: none;
    }

    main {
      padding: 0 clamp(14px, 4vw, 52px) 36px;
    }

    .hero {
      margin-bottom: 28px;
      padding: clamp(28px, 5vw, 44px);
      border-radius: 0 0 34px 34px;
      background: linear-gradient(110deg, var(--maroon) 0%, var(--maroon-dark) 100%);
      color: white;
    }

    .hero-pill {
      width: min(540px, 100%);
      margin-inline-start: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border-radius: 999px;
      background: white;
      color: var(--maroon);
      padding: 16px 24px;
      direction: ltr;
      font-size: clamp(26px, 5vw, 44px);
    }

    .hero-pill img {
      width: 68px;
      height: 68px;
    }

    .card {
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 253, 248, 0.92);
      box-shadow: 0 12px 30px rgba(77, 42, 29, 0.06);
      padding: clamp(20px, 4vw, 34px);
    }

    h1 {
      margin: 0 0 20px;
      color: var(--ink);
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 500;
    }

    .search {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      min-height: 58px;
      border: 1.3px solid var(--line);
      border-radius: 20px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-size: 19px;
      padding: 12px 18px;
      outline: none;
      direction: ltr;
    }

    input:focus {
      border-color: var(--maroon);
      box-shadow: 0 0 0 3px rgba(110, 29, 50, 0.08);
    }

    .search button {
      min-width: 130px;
      border-color: var(--maroon);
      background: var(--maroon);
      color: white;
    }

    .status-box {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 18px;
      background: #f5e7e9;
      color: var(--danger);
      font-weight: 700;
      line-height: 1.7;
    }

    .status-box.show {
      display: block;
    }

    .result {
      display: none;
      gap: 14px;
    }

    .result.show {
      display: grid;
    }

    .pill {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      border-radius: 999px;
      background: #f0e0e3;
      color: var(--maroon);
      font-weight: 700;
      padding: 8px 16px;
    }

    .pill.success {
      background: #e5f2e9;
      color: var(--success);
    }

    .pill.warning {
      background: #fff2d7;
      color: var(--warning);
    }

    .pill.danger {
      background: #f5dfe4;
      color: var(--danger);
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .detail {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      padding: 14px 16px;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .value {
      font-size: 19px;
      line-height: 1.5;
      word-break: break-word;
    }

    .note {
      margin-top: 18px;
      color: var(--muted);
      line-height: 1.8;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column-reverse;
        align-items: flex-start;
      }

      .hero {
        margin-inline: -14px;
        border-radius: 0 0 28px 28px;
      }

      .hero-pill {
        margin: 0;
      }

      .search,
      .details {
        grid-template-columns: 1fr;
      }

      .search {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="top-actions">
      <button type="button" id="langButton">EN / AR</button>
      <a class="link-button" href="/booking" data-i18n="bookLink">احجز الخدمة</a>
    </nav>
    <div class="brand">
      <img src="icons/tailor-logo-192.png" alt="">
      <span>Tailor Express</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-pill">
        <img src="icons/tailor-logo-192.png" alt="">
        <span>Tailor Express</span>
      </div>
    </section>

    <section class="card">
      <h1 data-i18n="title">تتبع الطلب</h1>
      <div class="search">
        <input id="orderInput" placeholder="TE-2401" autocomplete="off">
        <button type="button" id="searchButton" data-i18n="search">بحث</button>
      </div>
      <div id="statusBox" class="status-box"></div>
      <div id="result" class="result">
        <span id="stagePill" class="pill"></span>
        <div class="details">
          <div class="detail">
            <div class="label" data-i18n="orderNo">رقم الطلب</div>
            <div class="value" id="orderNo"></div>
          </div>
          <div class="detail">
            <div class="label" data-i18n="payment">الدفع</div>
            <div class="value" id="payment"></div>
          </div>
          <div class="detail">
            <div class="label" data-i18n="visit">موعد الزيارة</div>
            <div class="value" id="visit"></div>
          </div>
          <div class="detail">
            <div class="label" data-i18n="service">الخدمة</div>
            <div class="value" id="service"></div>
          </div>
          <div class="detail">
            <div class="label" data-i18n="area">المنطقة</div>
            <div class="value" id="area"></div>
          </div>
          <div class="detail">
            <div class="label" data-i18n="amount">المبلغ</div>
            <div class="value" id="amount"></div>
          </div>
        </div>
        <p class="note" id="cancelReason"></p>
      </div>
      <p class="note" data-i18n="safeNote">هذه صفحة تتبع آمنة للعميل. لا تعرض أرقام العملاء أو العناوين أو بيانات اللوحات الداخلية.</p>
    </section>
  </main>

  <script>
    const translations = {
      ar: {
        bookLink: 'احجز الخدمة',
        title: 'تتبع الطلب',
        search: 'بحث',
        orderNo: 'رقم الطلب',
        payment: 'الدفع',
        visit: 'موعد الزيارة',
        service: 'الخدمة',
        area: 'المنطقة',
        amount: 'المبلغ',
        safeNote: 'هذه صفحة تتبع آمنة للعميل. لا تعرض أرقام العملاء أو العناوين أو بيانات اللوحات الداخلية.',
        enterOrder: 'أدخل رقم الطلب.',
        loading: 'جاري البحث...',
        notFound: 'لم يتم العثور على هذا الطلب.',
        failed: 'تعذر تحميل حالة الطلب. حاول مرة أخرى.',
        paid: 'مدفوع',
        pending: 'معلق',
        cancelled: 'ملغي',
        newBooking: 'قيد الانتظار',
        completed: 'مكتمل',
        inShop: 'في المحل - قيد العمل',
        ready: 'جاهز',
        outForDelivery: 'خارج للتوصيل',
        delivered: 'تم التسليم',
        cancellationReason: 'سبب الإلغاء'
      },
      en: {
        bookLink: 'Book service',
        title: 'Track order',
        search: 'Search',
        orderNo: 'Order number',
        payment: 'Payment',
        visit: 'Visit time',
        service: 'Service',
        area: 'Area',
        amount: 'Amount',
        safeNote: 'This is a customer-safe tracking page. It does not show phone numbers, addresses, or internal dashboard data.',
        enterOrder: 'Enter the order number.',
        loading: 'Searching...',
        notFound: 'This order was not found.',
        failed: 'Could not load order status. Please try again.',
        paid: 'Paid',
        pending: 'Pending',
        cancelled: 'Cancelled',
        newBooking: 'Pending',
        completed: 'Completed',
        inShop: 'In Shop - In progress',
        ready: 'Ready',
        outForDelivery: 'Out for delivery',
        delivered: 'Delivered',
        cancellationReason: 'Cancellation reason'
      }
    };

    let lang = localStorage.getItem('tailor_public_lang') || 'ar';

    const el = (id) => document.getElementById(id);
    const t = (key) => translations[lang][key] || key;
    const money = (value) => `KD ${Number(value || 0).toFixed(3)}`;

    function applyLanguage() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        node.textContent = t(node.dataset.i18n);
      });
      el('langButton').textContent = lang === 'ar' ? 'English' : 'العربية';
      localStorage.setItem('tailor_public_lang', lang);
    }

    function showStatus(message) {
      el('result').classList.remove('show');
      const box = el('statusBox');
      box.textContent = message;
      box.classList.add('show');
    }

    function hideStatus() {
      const box = el('statusBox');
      box.textContent = '';
      box.classList.remove('show');
    }

    function stageLabel(stage) {
      const key = String(stage || '').trim();
      if (key === 'cancelled') return t('cancelled');
      if (key === 'newBooking') return t('newBooking');
      if (key === 'completed' || key === 'branchAssigned') return t('completed');
      if (key === 'onShop' || key === 'tailoring') return t('inShop');
      if (key === 'ready') return t('ready');
      if (key === 'outForDelivery' || key === 'assigned' || key === 'onWay') return t('outForDelivery');
      if (key === 'delivered') return t('delivered');
      return key || t('pending');
    }

    function stageClass(stage) {
      if (stage === 'delivered') return 'pill success';
      if (stage === 'cancelled') return 'pill danger';
      if (stage === 'newBooking') return 'pill warning';
      return 'pill';
    }

    function renderOrder(order) {
      hideStatus();
      el('result').classList.add('show');
      el('stagePill').className = stageClass(order.stage);
      el('stagePill').textContent = stageLabel(order.stage);
      el('orderNo').textContent = order.id || '-';
      el('payment').textContent = String(order.paymentStatus || '').toLowerCase() === 'paid' ? t('paid') : t('pending');
      el('visit').textContent = order.window || '-';
      el('service').textContent = order.service || '-';
      el('area').textContent = lang === 'ar' ? (order.areaAr || order.areaEn || '-') : (order.areaEn || order.areaAr || '-');
      el('amount').textContent = money(order.totalAmount || order.deliveryPrice || 0);
      el('cancelReason').textContent = order.cancelReason
        ? `${t('cancellationReason')}: ${order.cancelReason}`
        : '';
    }

    async function searchOrder() {
      const id = el('orderInput').value.trim();
      if (!id) {
        showStatus(t('enterOrder'));
        return;
      }
      showStatus(t('loading'));
      try {
        const response = await fetch(`/api/orders/${encodeURIComponent(id)}/public`, {
          headers: { Accept: 'application/json' }
        });
        if (response.status === 404) {
          showStatus(t('notFound'));
          return;
        }
        const body = await response.json();
        if (!response.ok) {
          throw new Error(body.error || t('failed'));
        }
        renderOrder(body);
      } catch (error) {
        showStatus(t('failed'));
      }
    }

    el('langButton').addEventListener('click', () => {
      lang = lang === 'ar' ? 'en' : 'ar';
      applyLanguage();
    });
    el('searchButton').addEventListener('click', searchOrder);
    el('orderInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') searchOrder();
    });

    applyLanguage();
    const initialOrder = new URLSearchParams(window.location.search).get('order') || '';
    if (initialOrder) {
      el('orderInput').value = initialOrder;
      searchOrder();
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((registration) => registration.update());
      });
    }
  </script>
</body>
</html>
