<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6E1D32">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/tailor-logo-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/tailor-logo-192.png">
  <title>Tailor Express Payment</title>
  <style>
    :root {
      --maroon: #6e1d32;
      --maroon-dark: #3a0d18;
      --sand: #faf5ea;
      --card: #fffdf8;
      --line: #ead8bc;
      --ink: #24191c;
      --muted: #766a67;
      --success: #326b45;
      --danger: #9b1c38;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      overflow-x: hidden;
      background: var(--sand);
      color: var(--ink);
      font-family: Arial, "Helvetica Neue", Tahoma, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(720px, 100%);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--card);
      box-shadow: none;
      padding: clamp(24px, 6vw, 44px);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      direction: ltr;
      color: var(--maroon);
      font-size: clamp(26px, 6vw, 44px);
      margin-bottom: 24px;
    }

    .brand img {
      width: 64px;
      height: 64px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 600;
    }

    p {
      color: var(--muted);
      font-size: 19px;
      line-height: 1.7;
      margin: 0 0 18px;
    }

    .pill {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #f0e0e3;
      color: var(--maroon);
      font-weight: 700;
    }

    .pill.success {
      background: #e5f2e9;
      color: var(--success);
    }

    .pill.danger {
      background: #f5dfe4;
      color: var(--danger);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1.5px solid rgba(110, 29, 50, 0.65);
      color: var(--maroon);
      text-decoration: none;
      font-weight: 700;
    }

    a.primary {
      border-color: var(--maroon);
      background: var(--maroon);
      color: white;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        border-radius: 24px;
        padding: 24px 16px;
      }

      .brand {
        gap: 10px;
        font-size: 30px;
        margin-bottom: 18px;
      }

      .brand img {
        width: 46px;
        height: 46px;
      }

      h1 {
        font-size: 30px;
      }

      p {
        font-size: 18px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      a {
        width: 100%;
        min-height: 54px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/icons/tailor-logo-192.png" alt="">
      <span>Tailor Express</span>
    </div>
    <div id="pill" class="pill">جار التحقق من الدفع</div>
    <h1 id="title">جار التحقق من الدفع</h1>
    <p id="message">يرجى إبقاء الصفحة مفتوحة. يتم حفظ الحجز فقط بعد تأكيد الدفع.</p>
    <div class="actions">
      <a id="trackLink" class="primary" href="/track" style="display:none">تتبع الطلب</a>
      <a href="/booking">العودة للحجز</a>
    </div>
  </main>

  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const result = pathParts[1] === 'return' ? 'return' : 'failed';
    const draftId = pathParts[2] || '';
    const returnToken = pathParts[3] || '';
    const params = new URLSearchParams(window.location.search);
    if (draftId) params.set('order', draftId);
    params.set('payment', result);
    params.set('source', 'return');
    if (returnToken) params.set('returnToken', returnToken);

    const el = (id) => document.getElementById(id);

    function setState(type, title, message, orderId) {
      el('pill').className = `pill ${type}`;
      el('pill').textContent = title;
      el('title').textContent = title;
      el('message').textContent = message;
      if (orderId) {
        el('trackLink').href = `/track?order=${encodeURIComponent(orderId)}`;
        el('trackLink').style.display = 'inline-flex';
      }
    }

    async function confirmPayment() {
      if (result !== 'return') {
        setState('danger', 'لم يكتمل الدفع', 'لم يتم حفظ الحجز لأن الدفع لم يكتمل.');
        return;
      }
      try {
        const payload = {};
        params.forEach((value, key) => payload[key] = value);
        const response = await fetch('/api/payments/confirm', {
          method: 'POST',
          headers: {
            Accept: 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            params: payload,
            orderId: payload.order || '',
            source: 'return'
          })
        });
        const body = await response.json().catch(() => ({}));
        const order = body.order || {};
        if (response.ok && body.status === 'paid' && order.id) {
          setState('success', 'تم تأكيد الدفع', `تم حفظ الحجز بنجاح. رقم الطلب: ${order.id}`, order.id);
          return;
        }
        setState('danger', 'تعذر تأكيد الدفع', 'لم يتم حفظ الحجز. إذا تم خصم المبلغ، تواصل مع الدعم قبل إعادة الدفع.');
      } catch (error) {
        setState('danger', 'تعذر تأكيد الدفع', 'لم يتم حفظ الحجز. إذا تم خصم المبلغ، تواصل مع الدعم قبل إعادة الدفع.');
      }
    }

    confirmPayment();
  </script>
</body>
</html>
