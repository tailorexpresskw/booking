<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6E1D32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tailor Express">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="customer_manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/tailor-logo-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/tailor-logo-192.png">
  <title>Tailor Express Booking</title>
  <style>
    :root {
      --maroon: #6e1d32;
      --maroon-dark: #3a0d18;
      --sand: #faf5ea;
      --card: #fffdf8;
      --line: #ead8bc;
      --ink: #24191c;
      --muted: #766a67;
      --danger: #9b1c38;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--sand);
      color: var(--ink);
      font-family: Arial, "Helvetica Neue", Tahoma, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px clamp(16px, 5vw, 48px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--maroon);
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 500;
      direction: ltr;
    }

    .brand img {
      width: 46px;
      height: 46px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    button,
    .link-button {
      border: 1.5px solid rgba(110, 29, 50, 0.65);
      border-radius: 999px;
      background: #fffaf2;
      color: var(--maroon);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      min-height: 46px;
      padding: 10px 20px;
      text-decoration: none;
    }

    main {
      padding: 0 clamp(14px, 4vw, 52px) 36px;
    }

    .hero {
      margin-bottom: 28px;
      padding: clamp(18px, 4vw, 32px);
      border-radius: 0 0 34px 34px;
      background: linear-gradient(100deg, var(--maroon) 0%, var(--maroon-dark) 100%);
      color: white;
    }

    .hero-pill {
      width: min(520px, 100%);
      margin-inline-start: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border-radius: 999px;
      background: white;
      color: var(--maroon);
      padding: 14px 22px;
      direction: ltr;
      font-size: clamp(26px, 5vw, 42px);
    }

    .hero-pill img {
      width: 58px;
      height: 58px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
      gap: 24px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      box-shadow: none;
      padding: clamp(20px, 4vw, 34px);
    }

    h1,
    h2 {
      margin: 0 0 20px;
      color: var(--ink);
      font-weight: 500;
    }

    h1 {
      font-size: clamp(30px, 5vw, 46px);
    }

    h2 {
      font-size: clamp(24px, 4vw, 34px);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 14px;
      margin: 0 12px 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 58px;
      border: 1.3px solid var(--line);
      border-radius: 20px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-size: 19px;
      padding: 12px 18px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--maroon);
      box-shadow: 0 0 0 3px rgba(110, 29, 50, 0.08);
    }

    #areaFilter {
      margin-bottom: 10px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    .amount {
      display: grid;
      place-items: center;
      min-height: 58px;
      border: 1.3px solid var(--line);
      border-radius: 20px;
      background: white;
      font-size: 22px;
      font-weight: 700;
      direction: ltr;
    }

    .primary {
      width: 100%;
      margin-top: 18px;
      min-height: 62px;
      border: 0;
      background: var(--maroon);
      color: white;
      font-size: 22px;
      box-shadow: 0 8px 18px rgba(78, 17, 33, 0.22);
    }

    .primary:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .note {
      margin-top: 14px;
      color: var(--muted);
      line-height: 1.8;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: #f5e7e9;
      color: var(--danger);
      font-weight: 700;
      line-height: 1.6;
    }

    .status.show {
      display: block;
    }

    .policy-list {
      margin: 0;
      padding-inline-start: 22px;
      color: var(--muted);
      line-height: 1.9;
    }

    .policy-gate {
      margin-top: 4px;
      border: 1.3px solid var(--line);
      border-radius: 22px;
      background: #fffaf2;
      padding: 18px;
    }

    .policy-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .policy-gate h2 {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
    }

    .policy-gate .policy-list {
      margin-bottom: 14px;
    }

    .policy-toggle {
      min-height: 42px;
      padding: 8px 16px;
      flex: 0 0 auto;
      background: white;
    }

    .policy-cards {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
    }

    .policy-cards[hidden] {
      display: none;
    }

    .policy-card {
      border: 1px solid rgba(110, 29, 50, 0.16);
      border-radius: 18px;
      background: white;
      padding: 14px;
    }

    .policy-card h3 {
      margin: 0 0 8px;
      color: var(--maroon);
      font-size: 20px;
      font-weight: 700;
    }

    .policy-card p {
      margin: 0;
      color: var(--ink);
      line-height: 1.75;
      white-space: pre-line;
    }

    .agreement {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
      line-height: 1.6;
    }

    .agreement input {
      width: 22px;
      height: 22px;
      min-height: 0;
      margin: 4px 0 0;
      padding: 0;
      flex: 0 0 22px;
      accent-color: var(--maroon);
    }

    .track-box {
      margin-top: 18px;
      display: flex;
      gap: 10px;
    }

    .track-box input {
      direction: ltr;
    }

    .track-box button {
      min-width: 90px;
      background: var(--maroon);
      color: white;
      border-color: var(--maroon);
    }

    @media (max-width: 900px) {
      header {
        align-items: flex-start;
        flex-direction: column-reverse;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        margin-inline: -14px;
        border-radius: 0 0 28px 28px;
      }

      .hero-pill {
        margin: 0;
      }
    }

    @media (max-width: 480px) {
      header {
        gap: 10px;
        padding: 12px 12px 10px;
      }

      .brand {
        font-size: 24px;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      .top-actions {
        width: 100%;
      }

      button,
      .link-button {
        min-height: 42px;
        padding: 9px 15px;
        font-size: 16px;
      }

      main {
        padding: 0 10px 28px;
      }

      .hero {
        margin: 0 -10px 18px;
        padding: 18px 12px;
        border-radius: 0 0 24px 24px;
      }

      .hero-pill {
        gap: 12px;
        padding: 12px 14px;
        font-size: 30px;
      }

      .hero-pill img {
        width: 44px;
        height: 44px;
      }

      .grid {
        gap: 16px;
      }

      .card {
        border-radius: 22px;
        padding: 18px 14px;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 16px;
      }

      h2 {
        font-size: 25px;
      }

      .form-grid {
        gap: 13px;
      }

      .policy-gate {
        border-radius: 20px;
        padding: 15px;
      }

      .policy-header {
        display: grid;
        grid-template-columns: 1fr;
      }

      .policy-toggle {
        width: 100%;
      }

      input,
      select,
      textarea,
      .amount {
        min-height: 54px;
        border-radius: 18px;
        font-size: 18px;
        padding: 11px 15px;
      }

      textarea {
        min-height: 104px;
      }

      .primary {
        min-height: 58px;
        font-size: 20px;
      }

      .track-box {
        display: grid;
        grid-template-columns: 1fr;
      }

      .track-box button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="top-actions">
      <button type="button" id="langButton">EN / AR</button>
      <a class="link-button" href="/track" data-i18n="trackLink">تتبع الطلب</a>
    </nav>
    <div class="brand">
      <img src="icons/tailor-logo-192.png" alt="">
      <span>Tailor Express</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-pill">
        <img src="icons/tailor-logo-192.png" alt="">
        <span>Tailor Express</span>
      </div>
    </section>

    <section class="grid">
      <form id="bookingForm" class="card" autocomplete="on">
        <h1 data-i18n="title">احجز زيارة منزلية</h1>
        <div class="form-grid">
          <div>
            <label for="customer" data-i18n="customer">اسم العميل</label>
            <input id="customer" name="customer" required>
          </div>
          <div>
            <label for="mobile" data-i18n="mobile">رقم الهاتف</label>
            <input id="mobile" name="mobile" required inputmode="numeric" pattern="[0-9]{8}" maxlength="8">
          </div>
          <div class="full">
            <label for="areaSelect" data-i18n="area">المنطقة</label>
            <input id="areaFilter" name="areaFilter" data-i18n-placeholder="areaSearch" autocomplete="off">
            <select id="areaSelect" name="areaSelect" required></select>
          </div>
          <div>
            <label for="block" data-i18n="block">قطعة</label>
            <input id="block" name="block" required>
          </div>
          <div>
            <label for="street" data-i18n="street">شارع</label>
            <input id="street" name="street" required>
          </div>
          <div>
            <label for="building" data-i18n="building">مبنى / منزل</label>
            <input id="building" name="building" required>
          </div>
          <div>
            <label data-i18n="price">سعر التوصيل</label>
            <div class="amount" id="amount">KD 0.000</div>
          </div>
          <div>
            <label for="service" data-i18n="service">الخدمة</label>
            <select id="service" name="service"></select>
          </div>
          <div>
            <label for="preference" data-i18n="preference">تفضيل الخياط</label>
            <select id="preference" name="preference"></select>
          </div>
          <div>
            <label for="visitDate" data-i18n="date">يوم الزيارة</label>
            <select id="visitDate" name="visitDate" required></select>
          </div>
          <div>
            <label for="visitSlot" data-i18n="time">موعد الزيارة</label>
            <select id="visitSlot" name="visitSlot" required></select>
          </div>
          <div>
            <label for="paymentMethod" data-i18n="payment">طريقة الدفع</label>
            <select id="paymentMethod" name="paymentMethod">
              <option value="knet">KNET</option>
              <option value="cc">Credit card</option>
            </select>
          </div>
          <div class="full">
            <label for="notes" data-i18n="notes">ملاحظات</label>
            <textarea id="notes" name="notes"></textarea>
          </div>
          <div class="full policy-gate" id="policyGate">
            <div class="policy-header">
              <h2 data-i18n="policyTitle">السياسات قبل الدفع</h2>
              <button class="policy-toggle" id="policyToggle" type="button" aria-expanded="false" aria-controls="fullPolicyList" data-i18n="showPolicies">عرض السياسات</button>
            </div>
            <div class="policy-cards" id="fullPolicyList" hidden></div>
            <label class="agreement" for="policyAgree">
              <input id="policyAgree" type="checkbox" required>
              <span data-i18n="agreePolicy">قرأت السياسات وأوافق عليها قبل الانتقال للدفع.</span>
            </label>
          </div>
        </div>
        <button class="primary" id="submitButton" type="submit" data-i18n="lockedSubmit" disabled>وافق على السياسات للانتقال للدفع</button>
        <div class="status" id="statusBox"></div>
      </form>

      <aside class="card">
        <h2 data-i18n="before">ما الذي يحدث قبل الدفع</h2>
        <ul class="policy-list">
          <li data-i18n="policy1">يتم عرض السياسات قبل الدفع ويجب الموافقة عليها.</li>
          <li data-i18n="policy2">ينتقل العميل إلى الدفع فقط بعد الموافقة.</li>
          <li data-i18n="policy3">يتم حفظ الحجز فقط بعد نجاح الدفع.</li>
          <li data-i18n="policy4">يجب حجز الموعد قبل 3 ساعات على الأقل.</li>
        </ul>
        <div class="track-box">
          <input id="trackInput" placeholder="TE-2401">
          <button type="button" id="trackButton" data-i18n="search">بحث</button>
        </div>
      </aside>
    </section>
  </main>

        nameEn: 'Order Cancellation',
        nameAr: 'إلغاء الطلب',
        detailEn: `Acceptance of the invoice confirms the customer's agreement to all services, measurements, pricing, and policies.

        detailAr: `يعد قبول الفاتورة إقراراً من العميل بالموافقة على جميع الخدمات والمقاسات والأسعار والسياسات المعتمدة.

تسدد الدفعات مقدماً، وبمجرد البدء في أعمال الخياطة أو الإصلاح، لا يسمح بإلغاء الطلب.

في حال حدوث أي تأخير في تنفيذ الخدمة، لا يسمح بالإلغاء تحت أي ظرف من الظروف.`
      },
      {
        nameEn: 'Appointment Rescheduling',
        nameAr: 'إعادة جدولة المواعيد',
        detailEn: `For home services, the customer will receive a confirmation link to confirm the appointment.

A fixed home services fee applies and is determined by location.

Appointments may be cancelled or rescheduled only if the request is made at least 3 hours before the scheduled time.

Requests made after this period will not be eligible for changes or fee refunds.`,
        detailAr: `في حال طلب خدمة منزلية، سيستلم العميل رابط تأكيد لتأكيد الموعد.

يتم تطبيق رسوم ثابتة للخدمة المنزلية، ويتم تحديدها حسب الموقع.

يمكن إلغاء الموعد أو إعادة جدولته فقط في حال تقديم الطلب قبل 3 ساعات على الأقل من الوقت المحدد.

الطلبات المقدمة بعد هذه المدة لن تكون مؤهلة للتعديل أو استرداد الرسوم.`
      },
      {
        nameEn: 'Delivery & Pickup',
        nameAr: 'التوصيل والاستلام',
        detailEn: `Customers are responsible for collecting their items from the company's branches once services are completed.

The expected completion time may range from 15 minutes to two weeks, depending on the type and volume of services. Timelines may change without prior notice due to circumstances beyond the company's control.

The company disclaims all responsibility for any items that are not collected within 7 days from the completion or notification date.`,
        detailAr: `يتحمل العملاء مسؤولية استلام قطعهم من فروع الشركة بعد إتمام الخدمات.

قد تتراوح مدة الإنجاز المتوقعة من 15 دقيقة إلى أسبوعين، وذلك بحسب نوع وحجم الخدمة، وقد تتغير المدة دون إشعار مسبق بسبب ظروف خارجة عن إرادة الشركة.

تخلي الشركة مسؤوليتها عن أي قطع لم يتم استلامها خلال 7 أيام من تاريخ الإنجاز أو الإخطار.`
      },
      {
        nameEn: 'Refund',
        nameAr: 'استرداد المبالغ',
        detailEn: `All service fees are non-refundable under any circumstances, including alterations, repairs, tailoring, delays, or unintentional damage.

The company does not provide compensation for the original value of items.

Home service fees are also non-refundable, except in cases where the appointment is cancelled at least three hours before the scheduled time.`,
        detailAr: `جميع رسوم الخدمات غير قابلة للاسترداد تحت أي ظرف من الظروف، بما في ذلك التعديلات والإصلاحات والخياطة والتأخير أو التلف غير المقصود.

لا تتحمل الشركة مسؤولية أو تعويض القيمة الأصلية للقطع.

رسوم الخدمة المنزلية غير قابلة للاسترداد أيضاً، باستثناء الحالات التي يتم فيها إلغاء الموعد قبل ثلاث ساعات على الأقل من الوقت المحدد.`
      }
    ];

    let lang = localStorage.getItem('tailor_public_lang') || 'ar';
    let policiesOpen = false;
    let areas = [];
    let schedule = { enabled: true, slots: fallbackSlots, rows: [] };

    const el = (id) => document.getElementById(id);
    const t = (key) => translations[lang][key] || key;
    const money = (value) => `KD ${Number(value || 0).toFixed(3)}`;

    function applyLanguage() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        node.textContent = t(node.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach((node) => {
        node.placeholder = t(node.dataset.i18nPlaceholder);
      });
      el('langButton').textContent = lang === 'ar' ? 'English' : 'العربية';
      renderPolicies();
      updatePolicyToggle();
      renderServiceOptions();
      renderPreferenceOptions();
      updateSubmitState();
      localStorage.setItem('tailor_public_lang', lang);
    }

    function updatePolicyToggle() {
      el('fullPolicyList').hidden = !policiesOpen;
      el('policyToggle').setAttribute('aria-expanded', String(policiesOpen));
      el('policyToggle').textContent = t(policiesOpen ? 'hidePolicies' : 'showPolicies');
    }

    function togglePolicies() {
      policiesOpen = !policiesOpen;
      updatePolicyToggle();
    }

    function renderPolicies() {
      const list = el('fullPolicyList');
      list.textContent = '';
      policyRecords.forEach((policy) => {
        const card = document.createElement('article');
        card.className = 'policy-card';
        const title = document.createElement('h3');
        title.textContent = lang === 'ar' ? policy.nameAr : policy.nameEn;
        const detail = document.createElement('p');
        detail.textContent = lang === 'ar' ? policy.detailAr : policy.detailEn;
        card.append(title, detail);
        list.append(card);
      });
    }

    function updateSubmitState() {
      const button = el('submitButton');
      const agreed = el('policyAgree').checked;
      if (button.dataset.loading === 'true') return;
      button.disabled = !agreed;
      button.textContent = agreed ? t('submit') : t('lockedSubmit');
      button.dataset.i18n = agreed ? 'submit' : 'lockedSubmit';
    }

    function renderServiceOptions() {
      const selected = el('service').value || 'Tailoring';
      const options = lang === 'ar'
        ? [{ value: 'Repair', label: 'تصليح' }, { value: 'Tailoring', label: 'تفصال' }]
        : [{ value: 'Repair', label: 'Repair' }, { value: 'Tailoring', label: 'Tailoring' }];
      el('service').innerHTML = options.map((item) =>
        `<option value="${item.value}">${item.label}</option>`).join('');
      el('service').value = selected;
    }

    function renderPreferenceOptions() {
      const selected = el('preference').value || '-';
      const options = lang === 'ar'
        ? [{ value: '-', label: '-' }, { value: 'Men tailor', label: 'خياط' }, { value: 'Women tailor', label: 'خياطة' }]
        : [{ value: '-', label: '-' }, { value: 'Men tailor', label: 'Men tailor' }, { value: 'Women tailor', label: 'Women tailor' }];
      el('preference').innerHTML = options.map((item) =>
        `<option value="${item.value}">${item.label}</option>`).join('');
      el('preference').value = selected;
    }

    function parseDateKey(value) {
      const match = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec(value || '');
      if (!match) return null;
      return new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
    }

    function parseSlotStart(dateKey, slot) {
      const date = parseDateKey(dateKey);
      const match = /(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i.exec(slot || '');
      if (!date || !match) return null;
      let hour = Number(match[1]);
      const minute = Number(match[2] || 0);
      const period = match[3].toUpperCase();
      if (period === 'PM' && hour !== 12) hour += 12;
      if (period === 'AM' && hour === 12) hour = 0;
      date.setHours(hour, minute, 0, 0);
      return date;
    }

    function slotAllowed(dateKey, slot) {
      const start = parseSlotStart(dateKey, slot);
      if (!start) return true;
      return start.getTime() >= Date.now() + 3 * 60 * 60 * 1000;
    }

    function slotsForRow(row) {
      const capacities = row.capacities || {};
      return (schedule.slots || fallbackSlots).filter((slot) =>
        Number(capacities[slot] || 0) > 0 && slotAllowed(row.date, slot));
    }

    function activeRows() {
      if (!schedule.enabled) return [];
      return (schedule.rows || []).filter((row) => slotsForRow(row).length > 0);
    }

    function renderAreas() {
      const current = el('areaSelect').value;
      const filter = el('areaFilter').value.trim().toLowerCase();
      const filtered = areas.filter((area) =>
        !filter || area.areaEn.toLowerCase().includes(filter));
      const visibleAreas = filtered.length ? filtered : areas;
      el('areaSelect').innerHTML = visibleAreas.map((area) =>
        `<option value="${area.areaEn}">${area.areaEn} - ${money(area.price)}</option>`).join('');
      if (visibleAreas.some((area) => area.areaEn === current)) {
        el('areaSelect').value = current;
      } else if (visibleAreas[0]) {
        el('areaSelect').value = visibleAreas[0].areaEn;
      }
      updateAmount();
    }

    function selectedArea() {
      const value = el('areaSelect').value.trim().toLowerCase();
      return areas.find((area) => area.areaEn.toLowerCase() === value);
    }

    function updateAmount() {
      const area = selectedArea();
      el('amount').textContent = money(area ? area.price : 0);
    }

    function renderDates() {
      const rows = activeRows();
      el('visitDate').innerHTML = rows.map((row) =>
        `<option value="${row.date}">${row.date} - ${row.day || ''}</option>`).join('');
      renderSlots();
    }

    function renderSlots() {
      const row = activeRows().find((item) => item.date === el('visitDate').value);
      const slots = row ? slotsForRow(row) : [];
      el('visitSlot').innerHTML = slots.map((slot) =>
        `<option value="${slot}">${slot}</option>`).join('');
    }

    function showStatus(message) {
      const box = el('statusBox');
      box.textContent = message;
      box.classList.add('show');
    }

    function clearStatus() {
      const box = el('statusBox');
      box.textContent = '';
      box.classList.remove('show');
    }

    async function loadData() {
      try {
        const [areaResponse, scheduleResponse] = await Promise.all([
          fetch('/api/area-prices', { headers: { Accept: 'application/json' } }),
          fetch('/api/booking-schedule', { headers: { Accept: 'application/json' } })
        ]);
        const areaJson = areaResponse.ok ? await areaResponse.json() : fallbackAreas;
        const scheduleJson = scheduleResponse.ok ? await scheduleResponse.json() : schedule;
        areas = (Array.isArray(areaJson) ? areaJson : fallbackAreas)
          .filter((area) => area && area.active !== false)
          .map((area) => ({
            areaEn: String(area.areaEn || area.name || '').trim(),
            price: Number(area.price || 0),
            active: area.active !== false
          }))
          .filter((area) => area.areaEn);
        if (!areas.length) areas = fallbackAreas;
        schedule = scheduleJson && typeof scheduleJson === 'object' ? scheduleJson : schedule;
      } catch (error) {
        areas = fallbackAreas;
      }
      renderAreas();
      renderDates();
    }

    async function submitBooking(event) {
      event.preventDefault();
      clearStatus();

      const mobile = el('mobile').value.trim();
      const area = selectedArea();
      if (!/^[4569]\d{7}$/.test(mobile)) {
        showStatus(t('invalidPhone'));
        return;
      }
      if (!area) {
        showStatus(t('invalidArea'));
        return;
      }
      if (!el('visitSlot').value) {
        showStatus(t('noSlot'));
        return;
      }
      if (!el('policyAgree').checked) {
        showStatus(t('agreeRequired'));
        el('policyGate').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (!confirm(t('confirm'))) return;

      const selectedGatewaySrc = el('paymentMethod').value;
      const methodLabel = selectedGatewaySrc === 'cc' ? 'Credit card' : 'KNET';
      const paymentMethod = `UPay - ${methodLabel}`;
      const draftId = `DRAFT-${Date.now()}`;
      const visitWindow = `${el('visitDate').value}, ${el('visitSlot').value}`;
      const notes = el('notes').value.trim();
      const paymentNote = lang === 'ar' ? `الدفع: ${paymentMethod}` : `Payment: ${paymentMethod}`;
      const draft = {
        customer: el('customer').value.trim(),
        mobile,
        areaEn: area.areaEn,
        areaAr: area.areaEn,
        block: el('block').value.trim(),
        street: el('street').value.trim(),
        building: el('building').value.trim(),
        service: el('service').value,
        preference: el('preference').value,
        window: visitWindow,
        visitDateIso: parseDateKey(el('visitDate').value)?.toISOString() || '',
        customerNotes: notes,
        notes: notes ? `${notes} | ${paymentNote}` : paymentNote,
        paymentMethod,
        language: lang
      };

      el('submitButton').disabled = true;
      el('submitButton').textContent = t('loading');
      el('submitButton').dataset.loading = 'true';
      try {
        const response = await fetch('/api/payments/create', {
          method: 'POST',
          headers: {
            Accept: 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            orderId: draftId,
            customer: draft.customer,
            mobile: draft.mobile,
            service: draft.service,
            amount: area.price,
            method: paymentMethod,
            paymentGatewaySrc: selectedGatewaySrc,
            language: lang,
            origin: window.location.origin,
            draft
          })
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || !body.paymentUrl) {
          throw new Error(body.error || t('failed'));
        }
        window.location.assign(body.paymentUrl);
      } catch (error) {
        showStatus(`${t('failed')} ${error.message || ''}`.trim());
        delete el('submitButton').dataset.loading;
        updateSubmitState();
      }
    }

    el('langButton').addEventListener('click', () => {
      lang = lang === 'ar' ? 'en' : 'ar';
      applyLanguage();
    });
    el('areaFilter').addEventListener('input', renderAreas);
    el('areaSelect').addEventListener('change', updateAmount);
    el('visitDate').addEventListener('change', renderSlots);
    el('policyToggle').addEventListener('click', togglePolicies);
    el('policyAgree').addEventListener('change', updateSubmitState);
    el('trackButton').addEventListener('click', () => {
      const id = el('trackInput').value.trim();
      window.location.href = id ? `/track?order=${encodeURIComponent(id)}` : '/track';
    });
    el('bookingForm').addEventListener('submit', submitBooking);

    applyLanguage();
    loadData();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((registration) => registration.update());
      });
    }
  </script>
</body>
</html>
